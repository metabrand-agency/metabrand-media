<!-- Metabrand case videos. Installed site-wide in Webflow (Site settings -> Custom code): the style in Head, the script in Footer.
     Phones (up to 767 px) load name_m.mp4, the 1080 px mobile version made by mobile.py; a missing one falls back to name.mp4.
     window.mbSrc(url) gives the right file for this screen (used by the SimilarWorks script for "More works" cards).
     Related registered site scripts: CaseVideoExpand 1.2.0 (wide blocks grow to full width on scroll; blocks taller than
     wide are skipped, so vertical videos are not cropped) and SimilarWorks 1.3.0 ("More works" cards). Copies: site-scripts/. -->
<style>
html{scrollbar-gutter:stable}
.case-video{display:block;width:100%;height:auto;aspect-ratio:1920/1360;object-fit:cover;background:#0A161A;pointer-events:none}
.case-video::-webkit-media-controls-start-playback-button{display:none!important;-webkit-appearance:none}
.case-video::-webkit-media-controls{display:none!important}
.case-video-label{display:none!important}
.case-video-box>.case-video{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto}
</style>
<script>
(() => {
  // Case videos. Embed: <video class="case-video" muted loop playsinline poster=".../name.jpg"></video>
  // The video file is taken from the poster URL (name.jpg -> name.mp4) unless data-src is set.
  // Phones (up to 767 px wide) get the mobile version name_m.mp4 (1080 px wide); if it is missing, the full file loads.
  const BASE = 'https://metabrand-agency.github.io/metabrand-media/';
  const clean = s => (s || '').trim().replace(/\.(mp4|jpe?g)$/i, '');
  const PHONE = !!window.matchMedia && matchMedia('(max-width: 767px)').matches;
  window.mbSrc = u => PHONE && /\.mp4$/i.test(u) && !/_m\.mp4$/i.test(u) ? u.replace(/\.mp4$/i, '_m.mp4') : u;
  document.addEventListener('error', e => {
    const v = e.target;
    const s = v && v.tagName === 'VIDEO' ? v.getAttribute('src') || '' : '';
    if (!/_m\.mp4$/i.test(s)) return;
    const full = s.replace(/_m\.mp4$/i, '.mp4');
    if (v.dataset.src) v.dataset.src = full;
    v.src = full; v.load();
    const r = v.getBoundingClientRect();
    if (r.bottom > -400 && r.top < innerHeight + 400) { const p = v.play(); if (p) p.catch(() => {}); }
  }, true);
  // Case Video component: data-name / data-ratio on .case-video-box
  document.querySelectorAll('.case-video-box[data-name]').forEach(box => {
    const n = clean(box.dataset.name);
    if (!n || box.querySelector('video')) return;
    const r = (box.dataset.ratio || '').trim();
    if (r) box.style.aspectRatio = r;
    const v = document.createElement('video');
    v.className = 'case-video';
    v.poster = BASE + n + '.jpg';
    box.appendChild(v);
  });
  document.querySelectorAll('video.case-video').forEach(v => {
    const n = clean(v.dataset.name);
    if (n && !v.getAttribute('poster')) v.poster = BASE + n + '.jpg';
    const r = (v.dataset.ratio || '').trim();
    if (r) v.style.aspectRatio = r;
    const p = v.getAttribute('poster') || '';
    if (!v.dataset.src && /\.jpe?g$/i.test(p)) v.dataset.src = p.replace(/\.jpe?g$/i, '.mp4');
    if (v.dataset.src) v.dataset.src = mbSrc(v.dataset.src);
    v.muted = true; v.loop = true; v.playsInline = true;
    v.setAttribute('muted', ''); v.setAttribute('loop', ''); v.setAttribute('playsinline', '');
    if (!v.hasAttribute('preload')) v.preload = 'none';
  });
  const vids = document.querySelectorAll('video.case-video[data-src]');
  const io = new IntersectionObserver(entries => entries.forEach(e => {
    const v = e.target;
    if (e.isIntersecting) {
      if (!v.getAttribute('src')) { v.src = v.dataset.src; v.load(); }
      v.muted = true;
      const p = v.play(); if (p) p.catch(() => {});
    } else if (!v.paused) v.pause();
  }), { rootMargin: '400px 0px' });
  vids.forEach(v => io.observe(v));
})();
</script>
