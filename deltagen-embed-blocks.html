<!-- DeltaGen case: one Embed element per block, in page order.
     The file name appears once, in the poster URL: name.jpg is the poster, name.mp4 is the video (added by the site script).
     A block with a different aspect ratio gets style="aspect-ratio:W/H". Style and script live in the site custom code (see embed-global.html). -->

<!-- Promo reel (top of the case) -->
<video class="case-video" muted loop playsinline poster="https://metabrand-agency.github.io/metabrand-media/deltagen_promo.jpg"></video>

<!-- Logo over the rotating thermal sign -->
<video class="case-video" muted loop playsinline poster="https://metabrand-agency.github.io/metabrand-media/deltagen_spin.jpg"></video>

<!-- Logo animation -->
<video class="case-video" muted loop playsinline poster="https://metabrand-agency.github.io/metabrand-media/deltagen_logo.jpg"></video>

<!-- Logo construction: wordmark + sign, side by side on desktop, stacked on mobile -->
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0">
  <video class="case-video" style="aspect-ratio:960/1360" muted loop playsinline poster="https://metabrand-agency.github.io/metabrand-media/deltagen_build_text.jpg"></video>
  <video class="case-video" style="aspect-ratio:960/1360" muted loop playsinline poster="https://metabrand-agency.github.io/metabrand-media/deltagen_build_sign.jpg"></video>
</div>
