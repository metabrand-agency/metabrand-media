<script>
/* Actions tracking. Ahrefs Web Analytics gets an event for every key action.
   Google Ads gets a conversion only for a real lead: a booked call or a sent contact form.
   Events: Call click, Call time picked, Call booked, Form sent, Form error, Subscribe, Contact click, Email click. */
(function () {
  var CAL = "https://calendly.com/metabrand/30min";
  var ADS_CALL = "AW-16803271007/SsgfCOm0-JwbEN-itsw-";
  var ADS_FORM = "AW-16803271007/j8ZFCK2kpfEZEN-itsw-";
  var path = location.pathname.replace(/\/+$/, "") || "/";

  function ev(name, props) {
    var p = props || {};
    p.page = path;
    try { if (window.AhrefsAnalytics) window.AhrefsAnalytics.sendEvent(name, { props: p }); } catch (e) {}
  }
  function ads(sendTo, extra) {
    try {
      if (typeof window.gtag !== "function") return;
      var o = { send_to: sendTo };
      if (extra) for (var k in extra) o[k] = extra[k];
      window.gtag("event", "conversion", o);
    } catch (e) {}
  }
  window.mbEvent = ev;
  /* The old Google Ads helper counted a conversion on every button click. Conversions are now sent below. */
  window.gtag_report_conversion = function (url) { if (url) window.location = url; return false; };

  function place(el) {
    if (el.closest(".w-nav")) return "nav";
    if (el.closest("footer, .footer")) return "footer";
    if (/^\/work\//.test(path)) return "case";
    return "page";
  }

  /* Clicks: Book a call, contact links, email */
  document.addEventListener("click", function (e) {
    var t = e.target;
    if (!t || !t.closest) return;
    var call = t.closest("[data-mb-call], .js-calendly, a[href*='calendly.com']");
    if (call) {
      if (call.hasAttribute("data-mb-call")) {
        /* Article buttons: the article kit opens Calendly itself */
        ev("Call click", { place: "article-" + call.getAttribute("data-mb-call") });
        return;
      }
      e.preventDefault();
      ev("Call click", { place: place(call) });
      if (window.Calendly && typeof window.Calendly.initPopupWidget === "function") {
        window.Calendly.initPopupWidget({ url: CAL });
      } else {
        window.open(CAL, "_blank", "noopener");
      }
      return;
    }
    var a = t.closest("a[href]");
    if (!a) return;
    var h = a.getAttribute("href") || "";
    if (/^mailto:/i.test(h)) {
      ev("Email click", { place: place(a) });
    } else if (/^(https?:\/\/(www\.)?metabrand\.digital)?\/contact\/?([?#].*)?$/i.test(h)) {
      ev("Contact click", { place: a.hasAttribute("data-mb-proposal") ? "article-" + a.getAttribute("data-mb-proposal") : place(a) });
    }
  });

  /* Calendly popup: time picked and call booked */
  window.addEventListener("message", function (e) {
    if (e.origin !== "https://calendly.com" || !e.data || typeof e.data.event !== "string") return;
    if (e.data.event === "calendly.date_and_time_selected") ev("Call time picked");
    if (e.data.event === "calendly.event_scheduled") {
      ev("Call booked");
      ads(ADS_CALL);
    }
  });

  /* Webflow forms: count only a confirmed success or error */
  function shown(el) { return !!el && getComputedStyle(el).display !== "none"; }
  document.addEventListener("submit", function (e) {
    var f = e.target;
    if (!f || f.tagName !== "FORM" || f.id === "ck-form") return;
    var box = f.closest(".w-form") || f.parentNode;
    var name = f.getAttribute("data-name") || f.id || "form";
    var sub = /learn|subscribe|newsletter/i.test(name);
    var tries = 0;
    var timer = setInterval(function () {
      tries++;
      if (shown(box.querySelector(".w-form-done"))) {
        clearInterval(timer);
        if (sub) {
          ev("Subscribe", { form: name });
        } else {
          ev("Form sent", { form: name });
          ads(ADS_FORM, { value: 1.0, currency: "USD" });
        }
      } else if (shown(box.querySelector(".w-form-fail"))) {
        clearInterval(timer);
        ev("Form error", { form: name });
      } else if (tries > 80) {
        clearInterval(timer);
      }
    }, 250);
  }, true);
})();
</script>

<script>
(function () {
  function getParams() {
    const params = {};
    const query = new URLSearchParams(window.location.search);

    query.forEach(function (value, key) {
      params[key] = value;
    });

    return params;
  }

  const ftKey = "first_touch";
  const ltKey = "last_touch";

  function safeParse(value) {
    try {
      return JSON.parse(value || "{}");
    } catch (e) {
      return {};
    }
  }

  try {
    const currentParams = getParams();

    if (Object.keys(currentParams).length > 0) {
      currentParams.landing_page = window.location.href;

      if (!localStorage.getItem(ftKey)) {
        localStorage.setItem(ftKey, JSON.stringify(currentParams));
      }

      localStorage.setItem(ltKey, JSON.stringify(currentParams));
    }

    document.addEventListener("DOMContentLoaded", function () {
      const ft = safeParse(localStorage.getItem(ftKey));
      const lt = safeParse(localStorage.getItem(ltKey));

      document.querySelectorAll("form").forEach(function (form) {
        const fields = [
          "utm_source",
          "utm_medium",
          "utm_campaign",
          "utm_term",
          "utm_content",
          "landing_page"
        ];

        fields.forEach(function (field) {
          const ftField = form.querySelector(`[name="ft_${field}"]`);
          const ltField = form.querySelector(`[name="lt_${field}"]`);

          if (ftField) ftField.value = ft[field] || "";
          if (ltField) ltField.value = lt[field] || "";
        });

        const currentPageField = form.querySelector('[name="current_page"]');
        if (currentPageField) {
          currentPageField.value = window.location.href;
        }
      });
    });
  } catch (e) {
    console.warn("Tracking script failed:", e);
  }
})();
</script>



<script>
(() => {
  // Case videos. Embed: <video class="case-video" muted loop playsinline poster=".../name.jpg"></video>
  // The video file is taken from the poster URL (name.jpg -> name.mp4) unless data-src is set.
  // Light version name_m.mp4 (1080 px wide) on phones and wherever the video is shown at up to 1280 device pixels
  // (cards on tablets, Reading view); if it is missing, the full file loads.
  // A video starts loading half a screen before it comes into view, plays only while it is on screen and is
  // unloaded when it is more than a screen away. The poster is also the background, so the frame is never empty.
  // window.mbWatch(video) adds a video created later (Reading view, "More works" cards).
  const BASE = 'https://metabrand-agency.github.io/metabrand-media/';
  const clean = s => (s || '').trim().replace(/\.(mp4|jpe?g)$/i, '');
  const PHONE = !!window.matchMedia && matchMedia('(max-width: 767px)').matches;
  const isFull = u => /\.mp4$/i.test(u || '') && !/_m\.mp4$/i.test(u);
  const lite = u => u.replace(/\.mp4$/i, '_m.mp4');
  window.mbSrc = u => PHONE && isFull(u) ? lite(u) : u;
  const pick = v => {
    const u = v.dataset.src;
    if (!isFull(u) || v.dataset.full) return u;
    const w = v.getBoundingClientRect().width * (window.devicePixelRatio || 1);
    return PHONE || (w > 0 && w <= 1280) ? lite(u) : u;
  };
  const bg = v => {
    const p = v.getAttribute('poster');
    if (p && !v.style.backgroundImage) {
      v.style.backgroundImage = 'url("' + p + '")';
      v.style.backgroundSize = 'cover';
      v.style.backgroundPosition = 'center';
    }
  };
  const want = new WeakSet();
  const load = v => {
    if (!v.getAttribute('src') && v.dataset.src) { v.preload = 'auto'; v.src = pick(v); }
  };
  const unload = v => {
    want.delete(v);
    if (v.getAttribute('src')) { v.pause(); v.removeAttribute('src'); v.load(); }
  };
  const near = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) load(e.target); }), { rootMargin: '50% 0px' });
  const show = new IntersectionObserver(es => es.forEach(e => e.isIntersecting ? mbPlay(e.target) : mbPause(e.target)));
  const keep = new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting) unload(e.target); }), { rootMargin: '100% 0px' });
  window.mbPlay = v => {
    want.add(v); bg(v); load(v); keep.observe(v);
    v.muted = true;
    const p = v.play(); if (p) p.catch(() => {});
  };
  window.mbPause = v => { want.delete(v); if (!v.paused) v.pause(); };
  window.mbWatch = v => { if (!v.dataset.src) return; bg(v); [near, show, keep].forEach(o => o.observe(v)); };
  // A missing light version: load the full file instead
  document.addEventListener('error', e => {
    const v = e.target;
    const s = v && v.tagName === 'VIDEO' ? v.getAttribute('src') || '' : '';
    if (!/_m\.mp4$/i.test(s)) return;
    v.dataset.full = '1';
    v.src = s.replace(/_m\.mp4$/i, '.mp4');
    if (want.has(v)) { const p = v.play(); if (p) p.catch(() => {}); }
  }, true);
  // Case Video component: data-name / data-ratio on .case-video-box
  document.querySelectorAll('.case-video-box[data-name]').forEach(box => {
    const n = clean(box.dataset.name);
    if (!n || box.querySelector('video')) return;
    const r = (box.dataset.ratio || '').trim();
    if (r) box.style.aspectRatio = r;
    const v = document.createElement('video');
    v.className = 'case-video';
    v.poster = BASE + n + '.jpg';
    box.appendChild(v);
  });
  document.querySelectorAll('video.case-video').forEach(v => {
    const n = clean(v.dataset.name);
    if (n && !v.getAttribute('poster')) v.poster = BASE + n + '.jpg';
    const r = (v.dataset.ratio || '').trim();
    if (r) v.style.aspectRatio = r;
    const p = v.getAttribute('poster') || '';
    if (!v.dataset.src && /\.jpe?g$/i.test(p)) v.dataset.src = p.replace(/\.jpe?g$/i, '.mp4');
    v.muted = true; v.loop = true; v.playsInline = true;
    v.setAttribute('muted', ''); v.setAttribute('loop', ''); v.setAttribute('playsinline', '');
    if (!v.hasAttribute('preload')) v.preload = 'none';
  });
  document.querySelectorAll('video.case-video[data-src]').forEach(mbWatch);
})();
</script>

<style>

<script>
(function () {
  var BLANK = /[\s​-‍﻿]/g;
  function blank(s) { return !(s || '').replace(BLANK, ''); }
  function isLabel(el) { var g = el && el.querySelector('.grey'); return !!g && !blank(g.textContent); }
  function trimEnd(el) {
    var n = el.lastChild;
    while (n && ((n.nodeType === 3 && blank(n.textContent)) || (n.nodeType === 1 && n.tagName === 'BR'))) {
      var p = n.previousSibling; el.removeChild(n); n = p;
    }
  }
  // Project details: label / value pairs become ruled rows
  function details() {
    [].forEach.call(document.querySelectorAll('.grid04.workhead .div-block-22'), function (d) {
      if (d.classList.contains('mbx-dlist')) return;
      var kids = [].slice.call(d.children);
      kids.forEach(trimEnd);
      for (var i = 0; i < kids.length; i++) {
        if (isLabel(kids[i])) {
          kids[i].classList.add('mbx-dl');
          if (kids[i + 1] && !isLabel(kids[i + 1])) { kids[i + 1].classList.add('mbx-dv'); i++; }
        } else kids[i].classList.add('mbx-dx');
      }
      d.classList.add('mbx-dlist');
    });
  }
  // Reading view: the client review becomes the last chapter
  function review() {
    var txt = document.querySelector('.mbx-read__text');
    if (!txt || txt.querySelector('.mbx-rv')) return;
    var item = document.querySelector('[data-mb-rv-sec] .mb-rv-card .w-dyn-item');
    if (!item) return;
    var n = txt.querySelectorAll('.mbx-ch').length + 1;
    var ch = document.createElement('div'); ch.className = 'mbx-ch mbx-rv';
    var num = document.createElement('div'); num.className = 'mbx-ch__num'; num.textContent = '(' + (n < 10 ? '0' : '') + n + ')';
    var lab = document.createElement('div'); lab.className = 'mbx-ch__label'; lab.textContent = 'Client review';
    var card = document.createElement('div'); card.className = 'mb-rv-card mbx-rv__card';
    var c = item.cloneNode(true); c.removeAttribute('role'); card.appendChild(c);
    ch.appendChild(num); ch.appendChild(lab); ch.appendChild(card); txt.appendChild(ch);
  }
  function init() {
    details();
    review();
    new MutationObserver(review).observe(document.body, { childList: true });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>

<style>
/* Menu icon: two CSS lines instead of the menu.svg image. On hover they spread apart, on click they turn into a cross
   that also closes the menu. The full-screen menu drops with a spring and its links come in one after another. */
.mb-burger{position:fixed;left:0;top:0;z-index:1001;margin:0;padding:0;border:0;background:none;cursor:pointer;mix-blend-mode:difference;-webkit-tap-highlight-color:transparent;opacity:0;pointer-events:none}
.mb-burger::before{content:"";position:absolute;inset:-14px -10px}
.mb-burger i{position:absolute;left:0;right:0;top:50%;height:var(--t,3px);margin-top:calc(var(--t,3px)/-2);background:#fff;transition:transform .55s cubic-bezier(.34,1.56,.64,1)}
.mb-burger i:first-child{transform:translateY(calc(var(--g,5px)*-1))}
.mb-burger i:last-child{transform:translateY(var(--g,5px))}
@media (hover:hover) and (pointer:fine){
  .mb-burger:not(.is-open):hover i:first-child{transform:translateY(calc(var(--g,5px)*-1 - 3px))}
  .mb-burger:not(.is-open):hover i:last-child{transform:translateY(calc(var(--g,5px) + 3px))}
}
.mb-burger.is-open i:first-child{transform:rotate(45deg) scale(var(--x,.76),.6)}
.mb-burger.is-open i:last-child{transform:rotate(-45deg) scale(var(--x,.76),.6)}
.mb-burger:focus-visible{outline:1px solid #fff;outline-offset:8px}
html.mb-burger-on .navbar:not(.drop) .div-block-21 img,html.mb-burger-on .navbar.drop .div-block-21-copy img{visibility:hidden}
/* the menu overshoots a little when it drops, so it gets a black strip above its top edge */
html.mb-burger-on .navbar.drop::before{content:"";display:block;position:absolute;left:0;bottom:calc(100% - 1px);width:100%;height:30vh;background:inherit}

<script>
/* "Also from the inside" under the industry rows (Industries block on Services and the home page): hovering a name
   shows one picture above it and the name turns white; the picture fades out when the cursor leaves. Pictures are from
   the "hover" folder in assets; a name that is not in PICS gets no picture. Desktop only, like the pointer effects in
   the site head. */
(function () {
  var mq = window.matchMedia;
  if (!mq || !mq('(hover: hover) and (pointer: fine)').matches || mq('(prefers-reduced-motion: reduce)').matches) return;
  var CDN = 'https://cdn.prod.website-files.com/67961be73378773c7b3d359c/';
  var PICS = { 'payments': '6acf37683a9ace7712a13b7e_Frame%2028', 'enterprise software': '6acf3769073e591fa6604b89_Frame%2031',
    'robotics': '6acf37693e700fb70d0961f1_Frame%2037', 'medtech': '6acf3769073e591fa6604bd1_Frame%2035',
    'cybersecurity': '6acf3768d4b9d1d7fde33b69_Frame%2029', 'web3': '6acf3769e60d09796363efaa_Group%202085664712',
    'venture capital': '6acf3769073e591fa6604bad_Frame%2034' };
  var IN = 'cubic-bezier(.16,1,.3,1)', OUT = 'cubic-bezier(.55,0,.75,.15)';
  function tf(x, y, r, s) { return 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) rotate(' + r.toFixed(1) + 'deg) scale(' + s + ')'; }
  function init() {
    if (!Element.prototype.animate) return;
    [].forEach.call(document.querySelectorAll('.ind-more-list'), function (p) {
      if (p.children.length) return;
      var host = p.closest('section') || p.parentNode, layer = document.createElement('div');
      if (getComputedStyle(host).position === 'static') host.style.position = 'relative';
      layer.className = 'mb-trail';
      layer.setAttribute('aria-hidden', 'true');
      host.insertBefore(layer, host.firstChild);
      var parts = p.textContent.split(',');
      p.textContent = '';
      parts.forEach(function (t, i) {
        var name = t.trim(), pic = PICS[name.toLowerCase()];
        if (i) p.appendChild(document.createTextNode(', '));
        if (!pic) { p.appendChild(document.createTextNode(name)); return; }
        var s = document.createElement('span'), img = null, a = null;
        s.textContent = name;
        s.style.transition = 'color .3s';
        p.appendChild(s);
        /* the picture pops up above the middle of the name, a little tilted */
        s.addEventListener('mouseenter', function () {
          if (img) img.remove();

          var size = Math.round(Math.max(100, Math.min(140, innerWidth * 0.085)));
          var h = host.getBoundingClientRect(), b = s.getBoundingClientRect();
          var x = b.left - h.left + b.width / 2, y = b.top - h.top - size / 2 - 14, r = Math.random() * 8 - 4;
          img = document.createElement('img');
          img.className = 'mb-trail__t';
          img.alt = ''; img.decoding = 'async'; img.draggable = false;
          img.src = CDN + pic + '.avif';
          img.style.setProperty('--s', size + 'px');
          img._p = [x, y, r];
          layer.appendChild(img);
          a = img.animate([{ transform: tf(x, y + 30, r - 4, 0.6), opacity: 0 }, { transform: tf(x, y, r, 1), opacity: 1 }],
            { duration: 600, easing: IN, fill: 'forwards' });

          el.animate([from, { transform: tf(q[0], q[1] - 10, q[2] + 3, 0.85), opacity: 0 }], { duration: 260, easing: OUT, fill: 'forwards' })
            .onfinish = function () { el.remove(); };
        });
      });
    });

})();
</script>
